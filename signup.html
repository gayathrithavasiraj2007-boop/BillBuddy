<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account — BillBuddy</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="signup.css"
    >

    <script src="auth.js"></script>

</head>


<body>

    <main class="login-page">

        <div class="login-card">

            <div class="login-logo">
                <span>B</span>
                BillBuddy
            </div>


            <h1>Create account.</h1>

            <p>
                Start managing your bills and warranties.
            </p>


            <form id="signupForm">

                <!-- NAME -->

                <label for="signupName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your name"
                    autocomplete="name"
                    required
                >


                <!-- EMAIL -->

                <label for="signupEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >


                <!-- PASSWORD -->

                <label for="signupPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >


                <!-- CONFIRM PASSWORD -->

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >


                <button
                    type="submit"
                    class="sign-in-button"
                >
                    Create Account
                    <span>→</span>
                </button>

            </form>


            <p class="signup-text">

                Already have an account?

                <a href="login.html">
                    Sign in
                </a>

            </p>

        </div>

    </main>


    <script>

        const signupForm =
            document.getElementById(
                "signupForm"
            );


        signupForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const name =
                    document.getElementById(
                        "signupName"
                    ).value.trim();


                const email =
                    document.getElementById(
                        "signupEmail"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "signupPassword"
                    ).value;


                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;


                // Check name
                if (!name) {

                    alert(
                        "Please enter your name."
                    );

                    return;
                }


                // Check password
                if (password.length < 8) {

                    alert(
                        "Password must contain at least 8 characters."
                    );

                    return;
                }


                // Check confirm password
                if (
                    password !==
                    confirmPassword
                ) {

                    alert(
                        "Passwords do not match."
                    );

                    return;
                }


                try {

                    await registerUser(
                        name,
                        email,
                        password
                    );


                    // Account created
                    // Directly go to dashboard

                    window.location.href =
                        "dashboard.html";

                }

                catch(error) {

                    alert(
                        error.message
                    );

                }

            }
        );

    </script>

</body>

</html>
